name: .NET CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProdeChamp.slnx

      - name: Build
        run: dotnet build ProdeChamp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ProdeChamp.slnx --no-build --configuration Release