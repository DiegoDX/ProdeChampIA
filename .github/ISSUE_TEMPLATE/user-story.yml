name: User Story
description: Create a ProdeChamp user story
title: "[STORY] "
labels: ["type:story"]

body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: Describe the user need
      value: |
        As a:
        I want:
        So that:
    validations:
      required: true

  - type: textarea
    id: rules
    attributes:
      label: Business Rules
      description: Business constraints and calculations
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Testable conditions
      placeholder: |
        Given...
        When...
        Then...
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: false
